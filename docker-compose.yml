services:

  frontend:
    build: ./Frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

  backend:
    build: ./Backend

    ports:
      - "5000:5000"

    depends_on:
      - postgres
      - redis
      - ai-service

    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/echobeat
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: MUbA2zhI0HeFQ4FGzGoeeoagilevbG4HlYQL5DZXMbX
      JWT_COOKIE_EXPIRE: 15d
      SESSION_SECRET: fallback_dev_secret
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

  ai-service:
    build: ./ai-service

    ports:
      - "8000:8000"

    env_file:
      - ./ai-service/.env

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  postgres:

    image: postgres:17-alpine

    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: echobeat

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
