name: echobeats
networks:
  default:
    name: echobeats_network
volumes:
  echobeats_db:

services:
  frontend:
    build:
      context: ./Frontend
    container_name: echobeats-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
        required: true
    restart: always
    networks:
      - default

  backend:
    build:
      context: ./Backend
    container_name: echobeats-backend
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    restart: always
    env_file:
      - ./Backend/.env
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports: []
    networks:
      - default

  postgres:
    image: postgres:17-alpine
    container_name: echobeats-postgres
    env_file:
      - ./Backend/.env
    volumes:
      - echobeats_db:/var/lib/postgresql/data
    ports: []
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U echobeats -d echobeats_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: echobeats-redis
    ports: []
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - default
  ai-service:
    build:
      context: ./ai-service
    container_name: echobeats-ai-service
    depends_on:
      backend:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    restart: always
    env_file:
      - ./ai-service/.env
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports: []
    networks:
      - default
