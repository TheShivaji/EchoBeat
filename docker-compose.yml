services:

  frontend:
    build: ./Frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

  backend:
    build: ./Backend

    ports:
      - "5000:5000"

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/echobeat

  postgres:

    image: postgres:17-alpine

    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: echobeat

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: